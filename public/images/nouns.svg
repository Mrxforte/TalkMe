<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching grammar_fundamentals soft blue-lilac studio) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="45%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Studio Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.12" />
    </filter>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.22" />
    </filter>

    <!-- 3D Book Gradients -->
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bookPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- 3D Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="25%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </radialGradient>

    <!-- 3D Gift Box Gradients -->
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="yellowRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="55" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="340" cy="110" r="70" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#E0E7FF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#F3E8FF" opacity="0.6" filter="url(#softGlow)" />

  <!-- Floating white 3D cards at top (like grammar_fundamentals.png) -->
  <g transform="translate(40, 45)" filter="url(#cardShadow)">
    <rect width="115" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#4F46E5">Person • Place</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">"Teacher, City"</text>
  </g>

  <g transform="translate(245, 50)" filter="url(#cardShadow)">
    <rect width="115" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#E11D48">Thing • Object</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">"Apple 🍎, Book"</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="395" rx="150" ry="40" fill="#1E1B4B" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="380" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D STACK OF BOOKS WITH CLAY APPLE AND GIFT BOX
       ======================================================== -->
  <g transform="translate(200, 260)" filter="url(#clayShadow)">
    <!-- Base 3D Purple Book -->
    <g transform="translate(-110, 50)">
      <!-- Book depth -->
      <rect x="0" y="24" width="220" height="20" rx="6" fill="#581C87" />
      <rect x="210" y="8" width="10" height="30" fill="#E2E8F0" />
      <!-- Book Cover -->
      <rect x="0" y="0" width="220" height="30" rx="8" fill="url(#bookPurple)" />
      <!-- Embossed title -->
      <text x="24" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#E9D5FF" letter-spacing="1">NOUNS &amp; OBJECTS</text>
    </g>

    <!-- Middle 3D Blue Book -->
    <g transform="translate(-100, 18)">
      <!-- Book depth -->
      <rect x="0" y="22" width="200" height="18" rx="6" fill="#1E40AF" />
      <rect x="190" y="8" width="10" height="26" fill="#E2E8F0" />
      <!-- Book Cover -->
      <rect x="0" y="0" width="200" height="26" rx="8" fill="url(#bookBlue)" />
      <text x="22" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#DBEAFE" letter-spacing="1">ENGLISH ESSENTIALS</text>
    </g>

    <!-- Top Open White/Pastel Pages Book -->
    <g transform="translate(-85, -15)">
      <!-- Open pages curves -->
      <path d="M 10 20 Q 85 5 85 28 Q 85 5 160 20 L 160 32 Q 85 18 85 38 Q 85 18 10 32 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <line x1="85" y1="28" x2="85" y2="38" stroke="#CBD5E1" stroke-width="2" />
    </g>

    <!-- 1. 3D CLAY RED APPLE (Resting on book) -->
    <g transform="translate(-40, -45)">
      <!-- Shadow on book -->
      <ellipse cx="0" cy="38" rx="30" ry="10" fill="#1E1B4B" opacity="0.3" filter="url(#softGlow)" />
      <!-- Apple body -->
      <circle cx="0" cy="0" r="36" fill="url(#appleGrad)" />
      <!-- Specular shine -->
      <ellipse cx="-12" cy="-14" rx="12" ry="7" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 -12 -14)" />
      <!-- Stem -->
      <path d="M 0 -34 C 4 -48 12 -44 14 -48" fill="none" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" />
      <!-- Green leaf -->
      <path d="M 4 -38 C 16 -46 22 -36 6 -34 Z" fill="#22C55E" />
      <!-- Name badge -->
      <g transform="translate(-24, 38)" filter="url(#cardShadow)">
        <rect width="48" height="20" rx="10" fill="#E11D48" />
        <text x="24" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">Apple</text>
      </g>
    </g>

    <!-- 2. 3D CUTE GIFT BOX (Resting on book next to apple) -->
    <g transform="translate(45, -40)">
      <!-- Shadow on book -->
      <ellipse cx="0" cy="40" rx="34" ry="10" fill="#1E1B4B" opacity="0.3" filter="url(#softGlow)" />
      <!-- Box base -->
      <rect x="-30" y="-10" width="60" height="50" rx="10" fill="url(#giftBox)" />
      <!-- Box lid -->
      <rect x="-35" y="-22" width="70" height="16" rx="6" fill="#38BDF8" stroke="#BAE6FD" stroke-width="1.5" />
      <!-- Yellow ribbons -->
      <rect x="-8" y="-10" width="16" height="50" fill="url(#yellowRibbon)" />
      <rect x="-8" y="-22" width="16" height="16" fill="url(#yellowRibbon)" />
      <!-- Yellow Bow on top -->
      <circle cx="-10" cy="-28" r="8" fill="none" stroke="#F59E0B" stroke-width="4" />
      <circle cx="10" cy="-28" r="8" fill="none" stroke="#F59E0B" stroke-width="4" />
      <circle cx="0" cy="-26" r="5" fill="#FACC15" />
      <!-- Name badge -->
      <g transform="translate(-20, 38)" filter="url(#cardShadow)">
        <rect width="40" height="20" rx="10" fill="#0284C7" />
        <text x="20" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">Gift</text>
      </g>
    </g>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#5E4B8B">NOUNS (OTLAR)</text>
  </g>
</svg>
