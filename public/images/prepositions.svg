<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching grammar_fundamentals soft blue-lilac studio) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1FD" />
      <stop offset="45%" stop-color="#F2EEFC" />
      <stop offset="100%" stop-color="#E5ECFB" />
    </linearGradient>

    <!-- Floor Pedestal / Soft studio surface -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E1E8F8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft shadows & blur filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="clayShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4B5563" flood-opacity="0.18" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5E4B8B" flood-opacity="0.12" />
    </filter>

    <!-- 3D Box Gradients (Isometric Clay Cube) -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#319795" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C7A7B" />
      <stop offset="100%" stop-color="#234E52" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#285E61" />
      <stop offset="100%" stop-color="#1D4044" />
    </linearGradient>

    <!-- Sphere Gradients (Clay spheres) -->
    <!-- Gold / Yellow "ON" Sphere -->
    <radialGradient id="goldSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="75%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </radialGradient>

    <!-- Blue / Cyan "IN" Sphere -->
    <radialGradient id="cyanSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Purple "NEXT TO" Sphere -->
    <radialGradient id="purpleSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#581C87" />
    </radialGradient>

    <!-- Coral / Pink "UNDER" Sphere -->
    <radialGradient id="coralSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="30%" stop-color="#FB7185" />
      <stop offset="80%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </radialGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Soft bokeh / ambient orbs -->
  <circle cx="80" cy="90" r="60" fill="#FFFFFF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="330" cy="120" r="75" fill="#FFFFFF" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="50" cy="400" r="50" fill="#E0E7FF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="410" r="70" fill="#EDE9FE" opacity="0.5" filter="url(#softGlow)" />

  <!-- Floating 3D educational note cards (like grammar_fundamentals.png) -->
  <g transform="translate(45, 45)" filter="url(#cardShadow)">
    <rect width="110" height="60" rx="14" fill="#FFFFFF" opacity="0.95" />
    <circle cx="22" cy="22" r="10" fill="#E6FFFA" />
    <text x="22" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#0D9488">📍</text>
    <text x="38" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#0F766E">Position</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">in • on • at</text>
  </g>

  <g transform="translate(245, 55)" filter="url(#cardShadow)">
    <rect width="115" height="55" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#7C3AED">Direction</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">to • through</text>
  </g>

  <!-- Ground Studio Ellipse Base with soft drop shadow -->
  <ellipse cx="200" cy="400" rx="150" ry="42" fill="#334155" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="385" rx="140" ry="38" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: CLEAR 3D ISOMETRIC BOX WITH IN / ON / UNDER / NEXT TO
       ======================================================== -->
  <g transform="translate(200, 280)">
    <!-- Main Box Ground Shadow -->
    <ellipse cx="0" cy="92" rx="90" ry="26" fill="#134E4A" opacity="0.22" filter="url(#softGlow)" />

    <!-- 1. UNDER SPHERE (placed at bottom under the shadow / pedestal) -->
    <g transform="translate(-85, 80)">
      <ellipse cx="0" cy="18" rx="20" ry="7" fill="#000000" opacity="0.2" />
      <circle cx="0" cy="0" r="18" fill="url(#coralSphere)" />
      <!-- Tag: UNDER -->
      <g transform="translate(-28, 22)" filter="url(#cardShadow)">
        <rect width="56" height="22" rx="11" fill="#E11D48" />
        <text x="28" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">UNDER</text>
      </g>
    </g>

    <!-- 2. NEXT TO SPHERE (placed on the right side) -->
    <g transform="translate(95, 60)">
      <ellipse cx="0" cy="18" rx="22" ry="8" fill="#000000" opacity="0.2" />
      <circle cx="0" cy="0" r="20" fill="url(#purpleSphere)" />
      <!-- Tag: NEXT TO -->
      <g transform="translate(-32, -32)" filter="url(#cardShadow)">
        <rect width="64" height="22" rx="11" fill="#7C3AED" />
        <text x="32" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9.5" fill="#FFFFFF">NEXT TO</text>
      </g>
    </g>

    <!-- 3. ISOMETRIC 3D BOX (Center) -->
    <!-- Left Face -->
    <polygon points="-75,-25 0,16 0,92 -75,51" fill="url(#boxLeft)" />
    <!-- Right Face -->
    <polygon points="0,16 75,-25 75,51 0,92" fill="url(#boxRight)" />
    <!-- Top Face (Inside opening) -->
    <polygon points="0,-66 75,-25 0,16 -75,-25" fill="url(#boxTop)" stroke="#A7F3D0" stroke-width="2" />

    <!-- Inner Box Hollow Depth & "IN" sphere inside -->
    <g transform="translate(0, -10)">
      <!-- Inner rim -->
      <polygon points="0,-45 55,-16 0,12 -55,-16" fill="#134E4A" opacity="0.8" />
      <!-- Sphere inside the box -->
      <circle cx="0" cy="-6" r="22" fill="url(#cyanSphere)" />
      <!-- IN Badge -->
      <g transform="translate(-20, -18)" filter="url(#cardShadow)">
        <rect width="40" height="22" rx="11" fill="#0284C7" stroke="#BAE6FD" stroke-width="1.5" />
        <text x="20" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">IN</text>
      </g>
    </g>

    <!-- 4. "ON" SPHERE (Resting on top) -->
    <g transform="translate(0, -96)">
      <!-- Contact shadow on the box lid -->
      <ellipse cx="0" cy="22" rx="18" ry="6" fill="#134E4A" opacity="0.45" />
      <!-- 3D Gold Ball -->
      <circle cx="0" cy="0" r="26" fill="url(#goldSphere)" />
      <!-- Soft gloss shine -->
      <ellipse cx="-8" cy="-8" rx="8" ry="5" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 -8 -8)" />
      <!-- Floating Badge: "ON" -->
      <g transform="translate(-22, -42)" filter="url(#cardShadow)">
        <rect width="44" height="24" rx="12" fill="#F59E0B" stroke="#FEF08A" stroke-width="1.5" />
        <text x="22" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">ON</text>
      </g>
    </g>

    <!-- Curved 3D Movement Path ("THROUGH" / "AROUND") -->
    <path d="M -110 30 Q -60 -40 20 -35 Q 90 -30 115 20" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="8 6" stroke-linecap="round" />
    <polygon points="120,24 121,10 109,16" fill="#FFFFFF" />
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#0D9488">PREPOSITIONS</text>
  </g>
</svg>
