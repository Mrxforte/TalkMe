<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching grammar_fundamentals soft blue-lilac studio) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Floor Pedestal / Soft studio surface -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter glows and drop shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.12" />
    </filter>
    <filter id="pieceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.22" />
    </filter>

    <!-- 3D Puzzle Block 1: SUBJECT (Blue / Cyan) -->
    <linearGradient id="puzzleBlueTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- 3D Puzzle Block 2: VERB (Purple / Violet) -->
    <linearGradient id="puzzlePurpleTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- 3D Puzzle Block 3: OBJECT (Amber / Coral) -->
    <linearGradient id="puzzleAmberTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- 3D Green Checkmark Badge -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="55" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="340" cy="110" r="70" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#E0E7FF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#F3E8FF" opacity="0.6" filter="url(#softGlow)" />

  <!-- Floating rule cards in top background -->
  <g transform="translate(40, 45)" filter="url(#cardShadow)">
    <rect width="135" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#4F46E5">Formula: S + V + O</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B">"She reads books"</text>
  </g>

  <g transform="translate(245, 45)" filter="url(#cardShadow)">
    <rect width="115" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#059669">Turlar / Types</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B">Oddiy va qo‘shma</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="390" rx="150" ry="40" fill="#1E1B4B" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="375" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D CONNECTED SENTENCE PUZZLE BLOCKS (S + V + O)
       ======================================================== -->
  <g transform="translate(45, 175)" filter="url(#pieceShadow)">
    <!-- 1. SUBJECT PUZZLE PIECE (Left - Blue) -->
    <g transform="translate(0, 40)">
      <!-- 3D Side depth -->
      <path d="M 12 90 L 12 104 Q 12 110 18 110 L 98 110 Q 104 110 104 104 L 104 90 Z" fill="#1D4ED8" />
      <!-- Main Front Puzzle Face with convex connector -->
      <path d="M 22 10 H 95 Q 100 10 100 15 V 38 C 112 38 118 48 118 55 C 118 62 112 72 100 72 V 95 Q 100 100 95 100 H 22 Q 15 100 15 95 V 15 Q 15 10 22 10 Z" fill="url(#puzzleBlueTop)" stroke="#93C5FD" stroke-width="2.5" />
      <!-- Shine highlight on top -->
      <rect x="25" y="16" width="65" height="8" rx="4" fill="#FFFFFF" opacity="0.4" />
      <!-- Label -->
      <text x="56" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#DBEAFE">SUBJECT</text>
      <text x="56" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">Ega</text>
      <text x="56" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#BFDBFE">(He, She)</text>
    </g>

    <!-- 2. VERB PUZZLE PIECE (Center - Purple) -->
    <g transform="translate(104, 30)">
      <!-- 3D Side depth -->
      <path d="M 10 90 L 10 104 Q 10 110 16 110 L 96 110 Q 102 110 102 104 L 102 90 Z" fill="#581C87" />
      <!-- Main Front Puzzle Face with concave left & convex right -->
      <path d="M 18 10 H 94 Q 100 10 100 16 V 38 C 112 38 118 48 118 55 C 118 62 112 72 100 72 V 94 Q 100 100 94 100 H 18 Q 12 100 12 94 V 72 C 24 72 30 62 30 55 C 30 48 24 38 12 38 V 16 Q 12 10 18 10 Z" fill="url(#puzzlePurpleTop)" stroke="#D8B4FE" stroke-width="2.5" />
      <!-- Shine highlight on top -->
      <rect x="28" y="16" width="60" height="8" rx="4" fill="#FFFFFF" opacity="0.4" />
      <!-- Label -->
      <text x="64" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#F3E8FF">VERB</text>
      <text x="64" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">Kesim</text>
      <text x="64" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#E9D5FF">(works)</text>
    </g>

    <!-- 3. OBJECT PUZZLE PIECE (Right - Amber) -->
    <g transform="translate(208, 40)">
      <!-- 3D Side depth -->
      <path d="M 10 90 L 10 104 Q 10 110 16 110 L 92 110 Q 98 110 98 104 L 98 90 Z" fill="#9A3412" />
      <!-- Main Front Puzzle Face with concave left -->
      <path d="M 18 10 H 92 Q 98 10 98 16 V 94 Q 98 100 92 100 H 18 Q 12 100 12 94 V 72 C 24 72 30 62 30 55 C 30 48 24 38 12 38 V 16 Q 12 10 18 10 Z" fill="url(#puzzleAmberTop)" stroke="#FED7AA" stroke-width="2.5" />
      <!-- Shine highlight on top -->
      <rect x="28" y="16" width="55" height="8" rx="4" fill="#FFFFFF" opacity="0.4" />
      <!-- Label -->
      <text x="60" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFEDD5">OBJECT</text>
      <text x="60" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">To‘ldiruvchi</text>
      <text x="60" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#FED7AA">(well)</text>
    </g>
  </g>

  <!-- Complete Sentence Speech Bubble banner over the puzzle -->
  <g transform="translate(70, 318)" filter="url(#cardShadow)">
    <rect width="260" height="50" rx="16" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2" />
    <!-- 3D Green checkmark badge -->
    <circle cx="28" cy="25" r="16" fill="url(#checkGrad)" />
    <path d="M 21 25 L 26 30 L 35 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sentence text -->
    <text x="56" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#15803D">To‘liq Gap Tuzilishi</text>
    <text x="56" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#4B5563">"She works very well."</text>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#6B21A8">SENTENCES (GAP)</text>
  </g>
</svg>
