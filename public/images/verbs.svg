<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching grammar_fundamentals soft blue-lilac studio) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="45%" stop-color="#FEE2E2" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Studio Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.15" />
    </filter>
    <filter id="actionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.22" />
    </filter>

    <!-- 3D Sneaker Gradients -->
    <linearGradient id="shoeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="60%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="shoeSole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 3D Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 3D Clock Dial -->
    <linearGradient id="clockRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="55" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="340" cy="110" r="70" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#FFEDD5" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#FEE2E2" opacity="0.6" filter="url(#softGlow)" />

  <!-- Floating white 3D cards at top -->
  <g transform="translate(40, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#EA580C">Action • Holat</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">"Run, Think, Speak"</text>
  </g>

  <g transform="translate(235, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#7C3AED">Zamonlar / Tenses</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B">Past • Pres • Future</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="395" rx="150" ry="40" fill="#7C2D12" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="380" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D RUNNING SNEAKER, LIGHTNING BOLT, AND CLOCK
       ======================================================== -->
  <g transform="translate(200, 260)" filter="url(#actionShadow)">
    <!-- 1. Tense Clock in background -->
    <g transform="translate(75, -50)">
      <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="url(#clockRim)" stroke-width="6" />
      <!-- Dial ticks -->
      <circle cx="0" cy="-30" r="2.5" fill="#8B5CF6" />
      <circle cx="30" cy="0" r="2.5" fill="#8B5CF6" />
      <circle cx="0" cy="30" r="2.5" fill="#8B5CF6" />
      <circle cx="-30" cy="0" r="2.5" fill="#8B5CF6" />
      <!-- Clock hands -->
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#6D28D9" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="0" x2="18" y2="8" stroke="#EA580C" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#EA580C" />
      <!-- Tag: Tenses -->
      <g transform="translate(-25, 26)" filter="url(#cardShadow)">
        <rect width="50" height="18" rx="9" fill="#7C3AED" />
        <text x="25" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">TENSES</text>
      </g>
    </g>

    <!-- 2. Dynamic 3D Lightning Bolt (Energy / Action) -->
    <g transform="translate(-80, -60)" filter="url(#cardShadow)">
      <polygon points="0,-40 18,-15 4,-12 24,18 -4,-2 8,-6" fill="url(#boltGrad)" stroke="#FEF08A" stroke-width="2" />
      <polygon points="0,-40 18,-15 4,-12 24,18 -4,-2 8,-6" fill="url(#boltGrad)" />
    </g>

    <!-- 3. Dynamic 3D Clay Running Sneaker (Center) -->
    <g transform="translate(-5, 0)">
      <!-- Sole Shadow -->
      <ellipse cx="-10" cy="48" rx="80" ry="18" fill="#7C2D12" opacity="0.3" filter="url(#softGlow)" />

      <!-- Sneaker Sole (Thick 3D White) -->
      <path d="M -75 32 Q -30 28 35 34 Q 65 38 68 44 Q 65 52 30 52 Q -45 52 -78 44 Q -85 36 -75 32 Z" fill="url(#shoeSole)" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Sneaker Upper Body (Orange Clay) -->
      <path d="M -70 32 Q -65 -15 -35 -20 Q -10 -22 15 8 Q 45 15 62 34 Q 30 28 -70 32 Z" fill="url(#shoeBody)" />

      <!-- White Toe Cap & Curved Accent -->
      <path d="M 32 18 Q 45 22 62 34 Q 35 32 20 28 Z" fill="#FFFFFF" opacity="0.9" />

      <!-- Sneaker Laces -->
      <line x1="-30" y1="-8" x2="-10" y2="2" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <line x1="-22" y1="-2" x2="-2" y2="8" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <line x1="-14" y1="4" x2="6" y2="14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

      <!-- Speed / Action Wind Swooshes -->
      <path d="M -110 10 Q -90 15 -75 14" stroke="#FB923C" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M -115 28 Q -95 30 -82 30" stroke="#FDBA74" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- 3D Action Badges: RUN & PLAY -->
    <g transform="translate(-50, 48)" filter="url(#cardShadow)">
      <rect width="52" height="24" rx="12" fill="#EA580C" stroke="#FED7AA" stroke-width="1.5" />
      <text x="26" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">RUN ⚡</text>
    </g>

    <g transform="translate(15, 48)" filter="url(#cardShadow)">
      <rect width="55" height="24" rx="12" fill="#F59E0B" stroke="#FEF08A" stroke-width="1.5" />
      <text x="27.5" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">PLAY ✨</text>
    </g>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#EA580C">VERBS &amp; TENSES</text>
  </g>
</svg>
