<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="45%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Studio Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.14" />
    </filter>
    <filter id="rocketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#312E81" flood-opacity="0.22" />
    </filter>

    <!-- 3D Rocket Gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="rocketRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="rocketFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="60%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Speedometer Gradient -->
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="55" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="340" cy="110" r="70" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#E0E7FF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#F3E8FF" opacity="0.6" filter="url(#softGlow)" />

  <!-- Floating white 3D cards at top -->
  <g transform="translate(40, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#4F46E5">Holat / Manner</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">Quickly • Loudly</text>
  </g>

  <g transform="translate(235, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#E11D48">Daraja / Degree</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B">Very • Extremely</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="395" rx="150" ry="40" fill="#312E81" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="380" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D SPEEDOMETER AND BLASTING FAST ROCKET
       ======================================================== -->
  <g transform="translate(200, 260)" filter="url(#rocketShadow)">
    <!-- 1. SPEEDOMETER GAUGE in background -->
    <g transform="translate(-70, 0)">
      <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
      <!-- Colored Speed Arc -->
      <path d="M -35 15 A 38 38 0 1 1 35 15" fill="none" stroke="url(#gaugeGrad)" stroke-width="8" stroke-linecap="round" />
      <!-- Dial needle pointing to MAXIMUM / FAST -->
      <line x1="0" y1="0" x2="24" y2="-22" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="5" fill="#1E293B" />
      <!-- Tag: FAST / QUICKLY -->
      <g transform="translate(-32, 28)" filter="url(#cardShadow)">
        <rect width="64" height="20" rx="10" fill="#EF4444" />
        <text x="32" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9.5" fill="#FFFFFF">QUICKLY</text>
      </g>
    </g>

    <!-- 2. 3D CLAY ROCKET BLASTING UPWARDS (Center-Right) -->
    <g transform="translate(50, -25) rotate(25)">
      <!-- Rocket Fire Blast -->
      <path d="M -12 40 Q 0 85 0 85 Q 12 40 12 40 Z" fill="url(#rocketFire)" />
      <!-- Soft smoke puffs -->
      <circle cx="-16" cy="65" r="14" fill="#FFFFFF" opacity="0.75" />
      <circle cx="16" cy="70" r="16" fill="#FFFFFF" opacity="0.75" />
      <circle cx="0" cy="80" r="18" fill="#FFFFFF" opacity="0.85" />

      <!-- Fins -->
      <polygon points="-18,22 -34,42 -14,38" fill="url(#rocketRed)" />
      <polygon points="18,22 34,42 14,38" fill="url(#rocketRed)" />

      <!-- Main Body -->
      <path d="M -18 36 C -18 5 0 -48 0 -48 C 0 -48 18 5 18 36 Z" fill="url(#rocketBody)" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Red Nose Cone -->
      <path d="M -12 -22 C -8 -38 0 -48 0 -48 C 0 -48 8 -38 12 -22 Z" fill="url(#rocketRed)" />

      <!-- Cyan Porthole Window -->
      <circle cx="0" cy="-2" r="9" fill="#0284C7" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="-3" cy="-5" r="2.5" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- 3D Manner Badge: "How? Easily!" -->
    <g transform="translate(-15, 60)" filter="url(#cardShadow)">
      <rect width="90" height="26" rx="13" fill="#4F46E5" stroke="#C7D2FE" stroke-width="1.5" />
      <text x="45" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">EASILY ⚡</text>
    </g>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#4338CA">ADVERBS (RAVISH)</text>
  </g>
</svg>
