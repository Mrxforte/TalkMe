<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="45%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Studio Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#99F6E4" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F766E" flood-opacity="0.14" />
    </filter>
    <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#134E4A" flood-opacity="0.22" />
    </filter>

    <!-- 3D Compass Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- 3D Map Pin Red -->
    <linearGradient id="pinRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- 3D Calendar Gradient -->
    <linearGradient id="calTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="55" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="340" cy="110" r="70" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#CCFBF1" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#EDE9FE" opacity="0.6" filter="url(#softGlow)" />

  <!-- Floating white 3D cards at top -->
  <g transform="translate(40, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0D9488">Payt / Time</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">"Yesterday, Soon"</text>
  </g>

  <g transform="translate(235, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#E11D48">O‘rin / Place</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B">"Here, At home"</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="395" rx="150" ry="40" fill="#134E4A" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="380" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D COMPASS, 3D RED MAP PIN & CALENDAR
       ======================================================== -->
  <g transform="translate(200, 260)" filter="url(#compassShadow)">
    <!-- 1. 3D GOLD COMPASS (Center Base) -->
    <g transform="translate(0, 10)">
      <!-- Ground Shadow -->
      <ellipse cx="0" cy="42" rx="75" ry="20" fill="#134E4A" opacity="0.25" filter="url(#softGlow)" />
      <!-- Outer Rim (Gold) -->
      <circle cx="0" cy="0" r="56" fill="url(#goldRim)" />
      <!-- Inner Dial (White / Mint) -->
      <circle cx="0" cy="0" r="46" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2" />
      <!-- Compass Rose Needle -->
      <polygon points="0,-38 8,-6 0,0 -8,-6" fill="#E11D48" />
      <polygon points="0,38 8,6 0,0 -8,6" fill="#0D9488" />
      <!-- Center Pivot -->
      <circle cx="0" cy="0" r="6" fill="#FACC15" stroke="#B45309" stroke-width="1.5" />
      <!-- Direction labels -->
      <text x="0" y="-24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#9F1239">N</text>
      <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#0F766E">S</text>
    </g>

    <!-- 2. 3D RED MAP LOCATION PIN (Left) -->
    <g transform="translate(-75, -45)">
      <!-- Pin shadow on ground -->
      <ellipse cx="0" cy="78" rx="18" ry="6" fill="#134E4A" opacity="0.3" filter="url(#softGlow)" />
      <!-- Pin body -->
      <path d="M 0 54 C -4 40 -28 20 -28 0 C -28 -18 -14 -30 0 -30 C 14 -30 28 -18 28 0 C 28 20 4 40 0 54 Z" fill="url(#pinRed)" stroke="#FDA4AF" stroke-width="1.5" />
      <!-- White dot in pin center -->
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
      <!-- Tag: WHERE? -->
      <g transform="translate(-30, -56)" filter="url(#cardShadow)">
        <rect width="60" height="20" rx="10" fill="#E11D48" />
        <text x="30" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">WHERE?</text>
      </g>
    </g>

    <!-- 3. 3D CALENDAR / CLOCK (Right) -->
    <g transform="translate(75, -35)">
      <!-- Shadow -->
      <ellipse cx="0" cy="68" rx="28" ry="8" fill="#134E4A" opacity="0.25" filter="url(#softGlow)" />
      <!-- Calendar Back & Pages -->
      <rect x="-26" y="-10" width="52" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <!-- Header Bar -->
      <rect x="-26" y="-22" width="52" height="18" rx="6" fill="url(#calTop)" />
      <!-- Rings -->
      <circle cx="-12" cy="-22" r="3" fill="#E2E8F0" />
      <circle cx="12" cy="-22" r="3" fill="#E2E8F0" />
      <!-- Date -->
      <text x="0" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0284C7">24</text>
      <!-- Tag: WHEN? -->
      <g transform="translate(-26, -46)" filter="url(#cardShadow)">
        <rect width="52" height="20" rx="10" fill="#0284C7" />
        <text x="26" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">WHEN?</text>
      </g>
    </g>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#0D9488">ADVERBIALS (HOLLAR)</text>
  </g>
</svg>
