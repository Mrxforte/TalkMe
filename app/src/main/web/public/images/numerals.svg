<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching grammar_fundamentals soft blue-lilac studio) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="45%" stop-color="#E8F8EE" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Studio Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803D" flood-opacity="0.12" />
    </filter>
    <filter id="numShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#14532D" flood-opacity="0.22" />
    </filter>

    <!-- 3D Numbers Gradients -->
    <!-- '1' Blue -->
    <linearGradient id="numOne" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- '2' Emerald Green -->
    <linearGradient id="numTwo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <!-- '3' Amber / Orange -->
    <linearGradient id="numThree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- 3D Podium Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="55" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="340" cy="110" r="70" fill="#FFFFFF" opacity="0.55" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#DCFCE7" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#E0F2FE" opacity="0.6" filter="url(#softGlow)" />

  <!-- Floating white 3D cards at top -->
  <g transform="translate(40, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#15803D">Sanoq / Cardinal</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B">One, Two, Three</text>
  </g>

  <g transform="translate(235, 45)" filter="url(#cardShadow)">
    <rect width="125" height="58" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#D97706">Tartib / Ordinal</text>
    <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B">1st, 2nd, 3rd...</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="395" rx="150" ry="40" fill="#14532D" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="380" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D NUMBER BLOCKS "1", "2", "3" ON PODIUM
       ======================================================== -->
  <g transform="translate(200, 260)" filter="url(#numShadow)">
    <!-- 3D Stepped Podium -->
    <!-- Middle Step (1st place) -->
    <g transform="translate(-40, 20)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="url(#podiumGrad)" stroke="#94A3B8" stroke-width="1.5" />
      <text x="40" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#64748B">1st</text>
    </g>
    <!-- Left Step (2nd place) -->
    <g transform="translate(-115, 40)">
      <rect x="0" y="0" width="75" height="40" rx="8" fill="url(#podiumGrad)" stroke="#94A3B8" stroke-width="1.5" />
      <text x="37.5" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#64748B">2nd</text>
    </g>
    <!-- Right Step (3rd place) -->
    <g transform="translate(40, 48)">
      <rect x="0" y="0" width="75" height="32" rx="8" fill="url(#podiumGrad)" stroke="#94A3B8" stroke-width="1.5" />
      <text x="37.5" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#64748B">3rd</text>
    </g>

    <!-- 1. BOLD 3D NUMBER "1" (Trophy position in center) -->
    <g transform="translate(0, -35)">
      <!-- Ground Shadow on podium -->
      <ellipse cx="0" cy="50" rx="28" ry="8" fill="#1E293B" opacity="0.3" filter="url(#softGlow)" />
      <!-- 3D Extrusion -->
      <text x="2" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="95" fill="#1E3A8A">1</text>
      <!-- Front Face -->
      <text x="0" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="95" fill="url(#numOne)">1</text>
      <!-- Crown on number 1 -->
      <path d="M -16 -40 L -8 -30 L 0 -44 L 8 -30 L 16 -40 L 12 -24 L -12 -24 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5" />
    </g>

    <!-- 2. BOLD 3D NUMBER "2" (Left green) -->
    <g transform="translate(-78, -5)">
      <ellipse cx="0" cy="42" rx="24" ry="7" fill="#14532D" opacity="0.3" filter="url(#softGlow)" />
      <text x="2" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="75" fill="#14532D">2</text>
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="75" fill="url(#numTwo)">2</text>
    </g>

    <!-- 3. BOLD 3D NUMBER "3" (Right orange) -->
    <g transform="translate(78, 5)">
      <ellipse cx="0" cy="40" rx="24" ry="7" fill="#7C2D12" opacity="0.3" filter="url(#softGlow)" />
      <text x="2" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="#7C2D12">3</text>
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="url(#numThree)">3</text>
    </g>

    <!-- Cute 3D Dice near the front -->
    <g transform="translate(-105, 45)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="2" />
      <circle cx="8" cy="8" r="2.5" fill="#EA580C" />
      <circle cx="14" cy="14" r="2.5" fill="#EA580C" />
      <circle cx="20" cy="20" r="2.5" fill="#EA580C" />
    </g>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#15803D">NUMERALS (SONLAR)</text>
  </g>
</svg>
