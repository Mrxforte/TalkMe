<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="45%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#FDF2F8" />
    </linearGradient>

    <!-- Floor Pedestal -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.12" />
    </filter>
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#312E81" flood-opacity="0.2" />
    </filter>

    <!-- 3D Letters Gradients -->
    <!-- 'A' Blue -->
    <linearGradient id="letterBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <!-- 'AN' Purple -->
    <linearGradient id="letterPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <!-- 'THE' Gold / Amber -->
    <linearGradient id="letterGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Apple Gradients -->
    <!-- Golden Apple (THE Apple) -->
    <radialGradient id="goldApple" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="75%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <!-- Green Apple (A green apple) -->
    <radialGradient id="greenApple" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#BBF7D0" />
      <stop offset="35%" stop-color="#4ADE80" />
      <stop offset="80%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </radialGradient>

    <!-- Magnifying Glass Rim -->
    <linearGradient id="magRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Ambient bokeh bubbles -->
  <circle cx="70" cy="80" r="60" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)" />
  <circle cx="330" cy="110" r="75" fill="#FFFFFF" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="60" cy="420" r="60" fill="#E0E7FF" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="340" cy="400" r="65" fill="#FCE7F3" opacity="0.5" filter="url(#softGlow)" />

  <!-- Top 3D Clay Floating Letters: A, AN, THE -->
  <g transform="translate(45, 45)" filter="url(#cardShadow)">
    <rect width="90" height="55" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="45" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#letterBlue)">A / AN</text>
    <text x="45" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#64748B">Noaniq (Indefinite)</text>
  </g>

  <g transform="translate(265, 45)" filter="url(#cardShadow)">
    <rect width="90" height="55" rx="14" fill="#FFFFFF" opacity="0.95" />
    <text x="45" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#letterGold)">THE</text>
    <text x="45" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#64748B">Aniq (Definite)</text>
  </g>

  <!-- Studio Ground Base -->
  <ellipse cx="200" cy="390" rx="150" ry="40" fill="#312E81" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="200" cy="375" rx="140" ry="36" fill="url(#floorGrad)" />

  <!-- ========================================================
       CENTERPIECE: 3D MAGNIFYING GLASS FOCUSING ON 'THE' GOLDEN APPLE
       ======================================================== -->
  <g transform="translate(200, 260)" filter="url(#appleShadow)">
    <!-- Side ordinary green apples (representing "an apple") -->
    <!-- Left green apple -->
    <g transform="translate(-105, 40)">
      <ellipse cx="0" cy="22" rx="22" ry="7" fill="#000000" opacity="0.15" />
      <circle cx="0" cy="0" r="22" fill="url(#greenApple)" />
      <!-- Leaf -->
      <path d="M 0 -22 C -6 -32 6 -34 4 -22 Z" fill="#15803D" />
      <!-- Tag: "an apple" -->
      <g transform="translate(-32, 28)" filter="url(#cardShadow)">
        <rect width="64" height="20" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
        <text x="32" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#15803D">an apple</text>
      </g>
    </g>

    <!-- Right green apple -->
    <g transform="translate(105, 40)">
      <ellipse cx="0" cy="22" rx="22" ry="7" fill="#000000" opacity="0.15" />
      <circle cx="0" cy="0" r="22" fill="url(#greenApple)" />
      <!-- Leaf -->
      <path d="M 0 -22 C 6 -32 -6 -34 -4 -22 Z" fill="#15803D" />
      <!-- Tag: "a book" / "a car" -->
      <g transform="translate(-30, 28)" filter="url(#cardShadow)">
        <rect width="60" height="20" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
        <text x="30" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#15803D">a fruit</text>
      </g>
    </g>

    <!-- CENTER: THE GOLDEN SHINING APPLE WITH MAGNIFYING GLASS -->
    <g transform="translate(0, 0)">
      <!-- Ground shadow under golden apple -->
      <ellipse cx="0" cy="46" rx="44" ry="14" fill="#78350F" opacity="0.25" filter="url(#softGlow)" />

      <!-- Glowing Star sparkles behind -->
      <circle cx="-35" cy="-35" r="4" fill="#FDE047" opacity="0.9" />
      <circle cx="40" cy="-25" r="5" fill="#FDE047" opacity="0.9" />

      <!-- Golden Apple (Large, detailed, 3D) -->
      <circle cx="0" cy="0" r="44" fill="url(#goldApple)" />
      <!-- Indentation at top -->
      <ellipse cx="0" cy="-38" rx="10" ry="4" fill="#92400E" opacity="0.6" />
      <!-- Stem -->
      <path d="M 0 -38 C 4 -54 14 -50 16 -54" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
      <!-- Golden leaf -->
      <path d="M 4 -44 C 18 -52 24 -40 8 -38 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5" />
      <!-- Specular shine on apple -->
      <ellipse cx="-16" cy="-16" rx="14" ry="8" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 -16 -16)" />

      <!-- 3D Magnifying Glass Frame around it -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="url(#magRim)" stroke-width="9" />
      <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
      <!-- Magnifying Glass Handle -->
      <g transform="translate(42, 42) rotate(45)">
        <rect x="0" y="-8" width="55" height="16" rx="8" fill="#1E40AF" stroke="#93C5FD" stroke-width="2" />
        <rect x="10" y="-5" width="35" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />
      </g>

      <!-- Badge directly below: "THE APPLE" (The exact one!) -->
      <g transform="translate(-60, 52)" filter="url(#cardShadow)">
        <rect width="120" height="28" rx="14" fill="#F59E0B" stroke="#FEF08A" stroke-width="2" />
        <text x="60" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">THE APPLE ⭐</text>
      </g>
    </g>
  </g>

  <!-- Bottom title card -->
  <g transform="translate(100, 436)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#FEF08A" stroke-width="2" />
    <text x="100" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#B45309">ARTICLES (A, AN, THE)</text>
  </g>
</svg>
